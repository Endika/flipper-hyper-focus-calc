name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck clang-format
      - name: Run linter
        run: make linter
      - name: Check format
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror
      - name: Run tests
        run: make test
      # The .fap is the only gate that compiles main.c, src/app/hyperfocus_app.c,
      # src/ui/calc_scene.c and src/persistence/sensors_store.c: they need the firmware's
      # furi headers, so gcc never sees them and cppcheck was their only reader. Last in
      # the job, so the fast gates above still fail first.
      - name: Build FAP
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          # Stable released firmware API, matching the release build — a dev-channel build
          # targets a newer API than stable firmware provides.
          sdk-channel: release
